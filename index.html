<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KasirKu POS Pro</title>
  <meta name="theme-color" content="#10B981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .tap-highlight-transparent {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased select-none pb-16">
  <!-- Top App Bar -->
  <header class="sticky top-0 z-30 shadow-md transition-colors" style="background-color: #10B981;">
    <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between text-white">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-xl bg-white/20 flex items-center justify-center font-bold text-lg shadow-inner">
          <i class="fa-solid fa-mobile-screen"></i>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight leading-tight">KasirKu POS Pro</h1>
          <p class="text-[11px] text-white/80 font-medium">Ready for Mobile • Zip to APK</p>
        </div>
      </div>
      <button id="btnRefresh" class="p-2 rounded-lg bg-white/15 active:scale-90 transition-transform">
        <i class="fa-solid fa-rotate"></i>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">
    <!-- Stat / Hero Summary -->
    <div class="rounded-2xl p-4 shadow-lg border border-slate-800 bg-slate-900/90 relative overflow-hidden">
      <div class="flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Status Aplikasi</span>
          <h2 class="text-xl font-extrabold text-white mt-0.5" id="heroSummaryTitle">Aktif &amp; Siap Digunakan</h2>
          <p class="text-xs text-slate-400 mt-1" id="heroSummarySubtitle">Semua fungsi lokal &amp; data tersimpan di HP.</p>
        </div>
        <div class="h-12 w-12 rounded-2xl flex items-center justify-center text-white text-xl shadow-lg" style="background-color: #10B981;">
          <i class="fa-solid fa-bolt"></i>
        </div>
      </div>
    </div>

    <!-- Interactive Search / Filter Bar -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-sm"></i>
      <input 
        type="text" 
        id="searchInput"
        placeholder="Cari item, riwayat, atau menu..." 
        class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors"
      />
    </div>

    <!-- Quick Action Buttons -->
    <div class="grid grid-cols-3 gap-2.5" id="quickActionsContainer">
      <button onclick="handleQuickAction('add')" class="p-3 rounded-xl bg-slate-900 border border-slate-800 hover:border-emerald-500/50 flex flex-col items-center gap-1.5 active:scale-95 transition-all">
        <div class="h-8 w-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-sm">
          <i class="fa-solid fa-plus"></i>
        </div>
        <span class="text-[11px] font-semibold text-slate-200">Tambah</span>
      </button>

      <button onclick="handleQuickAction('filter')" class="p-3 rounded-xl bg-slate-900 border border-slate-800 hover:border-indigo-500/50 flex flex-col items-center gap-1.5 active:scale-95 transition-all">
        <div class="h-8 w-8 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-sm">
          <i class="fa-solid fa-sliders"></i>
        </div>
        <span class="text-[11px] font-semibold text-slate-200">Filter</span>
      </button>

      <button onclick="handleQuickAction('export')" class="p-3 rounded-xl bg-slate-900 border border-slate-800 hover:border-amber-500/50 flex flex-col items-center gap-1.5 active:scale-95 transition-all">
        <div class="h-8 w-8 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center text-sm">
          <i class="fa-solid fa-share-nodes"></i>
        </div>
        <span class="text-[11px] font-semibold text-slate-200">Bagikan</span>
      </button>
    </div>

    <!-- Data List Header -->
    <div class="flex items-center justify-between pt-1">
      <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
        <i class="fa-solid fa-list-check text-emerald-400"></i>
        <span>Data &amp; Aktivitas</span>
      </h3>
      <span class="text-[10px] font-semibold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20" id="itemCountBadge">
        0 Item
      </span>
    </div>

    <!-- Dynamic Item List -->
    <div class="space-y-2.5" id="itemListContainer">
      <!-- Injected via JS -->
    </div>
  </main>

  <!-- Floating Add / Action Button -->
  <button 
    onclick="handleAddNewItem()"
    class="fixed bottom-6 right-6 h-14 w-14 rounded-full text-white shadow-2xl flex items-center justify-center text-xl active:scale-90 transition-transform z-40 border-2 border-white/20"
    style="background-color: #10B981; box-shadow: 0 10px 25px -5px #10B98188;"
    title="Tambah Data Baru"
  >
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl bg-slate-900 border border-emerald-500/40 text-emerald-300 text-xs font-semibold shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50">
    Aksi berhasil!
  </div>

  <script>
    const INITIAL_PREVIEW = {"screens":[{"id":"home","title":"Kasir & Transaksi","subtitle":"Shift Pagi • Kasir: Budi Santoso","icon":"ShoppingCart","stats":[{"label":"Penjualan Hari Ini","value":"Rp 3.850.000","change":"+18.4%","isPositive":true},{"label":"Total Transaksi","value":"42 Struk","change":"+5","isPositive":true},{"label":"Produk Terlaris","value":"Kopi Susu Gula Aren"}],"items":[{"id":"1","title":"Kopi Susu Gula Aren","subtitle":"Stok: 48 pcs • Minuman","badge":"Terlaris","amount":"Rp 18.000","status":"success","icon":"Coffee"},{"id":"2","title":"Roti Bakar Coklat Keju","subtitle":"Stok: 15 pcs • Makanan","badge":"Promo","amount":"Rp 22.000","status":"info","icon":"Utensils"},{"id":"3","title":"Matcha Latte Ice","subtitle":"Stok: 32 pcs • Minuman","badge":"Populer","amount":"Rp 24.000","status":"success","icon":"CupSoda"},{"id":"4","title":"French Fries Extra Cheese","subtitle":"Stok: 8 pcs • Snack","badge":"Stok Menipis","amount":"Rp 16.000","status":"warning","icon":"Box"},{"id":"5","title":"Croissant Butter Original","subtitle":"Stok: 24 pcs • Bakery","badge":"Fresh","amount":"Rp 20.000","status":"default","icon":"Croissant"}],"actions":["Scan Barcode","Bayar Sekarang","Cetak Struk","Diskon"],"sections":[{"heading":"Ringkasan Omset","type":"cards"},{"heading":"Keranjang Kasir","type":"list"}]},{"id":"inventory","title":"Manajemen Produk & Stok","subtitle":"124 Total Produk Aktif","icon":"Box","stats":[{"label":"Total Item","value":"124 SKUs"},{"label":"Stok Kritis (<10)","value":"3 Produk","isPositive":false},{"label":"Nilai Inventory","value":"Rp 14.200.000"}],"items":[{"id":"p1","title":"Kopi Arabika Gayo 250g","subtitle":"Kategori: Biji Kopi • Modal: Rp 45.000","badge":"Stok: 85","amount":"Rp 65.000","status":"success"},{"id":"p2","title":"Sirup Vanilla Monin 700ml","subtitle":"Kategori: Bahan Baku • Modal: Rp 110.000","badge":"Stok: 4 (Kritis)","amount":"Rp 145.000","status":"warning"},{"id":"p3","title":"Susu UHT Full Cream 1L","subtitle":"Kategori: Dairy • Modal: Rp 16.500","badge":"Stok: 60","amount":"Rp 21.000","status":"success"}],"actions":["+ Tambah Produk","Import Excel","Kategori"]},{"id":"reports","title":"Laporan & Analitik","subtitle":"Periode: Agustus 2026","icon":"BarChart3","stats":[{"label":"Total Pendapatan","value":"Rp 48.950.000","change":"+22.5%","isPositive":true},{"label":"Laba Bersih","value":"Rp 19.340.000","change":"+15.2%","isPositive":true},{"label":"Rata-rata Transaksi","value":"Rp 45.500"}],"items":[{"id":"r1","title":"Laporan Penjualan Harian","subtitle":"16 Agu 2026 • 42 Transaksi","badge":"Selesai","amount":"Rp 3.850.000","status":"success"},{"id":"r2","title":"Laporan Penjualan Harian","subtitle":"15 Agu 2026 • 58 Transaksi","badge":"Selesai","amount":"Rp 4.920.000","status":"success"},{"id":"r3","title":"Laporan Penjualan Harian","subtitle":"14 Agu 2026 • 39 Transaksi","badge":"Selesai","amount":"Rp 3.410.000","status":"success"}],"actions":["Export PDF","Kirim Email","Rekap Kasir"]},{"id":"settings","title":"Pengaturan Toko","subtitle":"Printer Bluetooth & Info Usaha","icon":"Settings","items":[{"id":"s1","title":"Printer Kasir Bluetooth","subtitle":"Status: Terhubung (RPP02N-58mm)","badge":"Connected","status":"success"},{"id":"s2","title":"Profil Toko & Header Struk","subtitle":"Kopi Kenangan Senja • Jakarta Selatan","badge":"Active","status":"info"},{"id":"s3","title":"Pajak & Biaya Layanan","subtitle":"PPN 11% • Service Charge 0%","badge":"Enabled","status":"default"},{"id":"s4","title":"Cadangkan & Pulihkan Data","subtitle":"Database tersimpan di memori internal","badge":"Auto Sync","status":"success"}],"actions":["Uji Cetak","Ganti Akun","Tentang Aplikasi"]}],"bottomNav":[{"id":"home","label":"Kasir","icon":"ShoppingCart"},{"id":"inventory","label":"Produk","icon":"Box"},{"id":"reports","label":"Laporan","icon":"BarChart3"},{"id":"settings","label":"Pengaturan","icon":"Settings"}]};
    let appItems = JSON.parse(localStorage.getItem('app_items_KasirKu POS Pro')) || (INITIAL_PREVIEW.items || [
      { id: '1', title: 'Transaksi &amp; Aktivitas Pertama', subtitle: 'Kategori Utama', price: 'Rp 25.000', status: 'Selesai' },
      { id: '2', title: 'Pencatatan Baru', subtitle: 'Operasional', price: 'Rp 50.000', status: 'Diproses' }
    ]);

    function renderList(itemsToRender) {
      const container = document.getElementById('itemListContainer');
      const badge = document.getElementById('itemCountBadge');
      if (!container) return;

      badge.textContent = itemsToRender.length + ' Item';

      if (itemsToRender.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center rounded-2xl bg-slate-900/50 border border-slate-800 text-slate-500 text-xs">
            <i class="fa-solid fa-box-open text-2xl mb-2 text-slate-600 block"></i>
            Tidak ada data yang cocok.
          </div>
        `;
        return;
      }

      container.innerHTML = itemsToRender.map((item, idx) => `
        <div class="p-3.5 rounded-xl bg-slate-900/90 border border-slate-800/80 hover:border-slate-700 flex items-center justify-between gap-3 active:scale-[0.99] transition-all">
          <div class="flex items-center gap-3 min-w-0">
            <div class="h-10 w-10 rounded-xl bg-slate-800 text-emerald-400 flex items-center justify-center font-bold text-sm shrink-0 border border-slate-700">
              ${idx + 1}
            </div>
            <div class="min-w-0">
              <h4 class="text-xs font-bold text-slate-100 truncate">${item.title || item.name || 'Item #' + (idx + 1)}</h4>
              <p class="text-[11px] text-slate-400 truncate">${item.subtitle || item.category || item.date || 'Tersimpan'}</p>
            </div>
          </div>
          <div class="text-right shrink-0">
            <span class="text-xs font-extrabold text-emerald-400 font-mono block">${item.price || item.amount || item.status || 'Aktif'}</span>
            <button onclick="handleDeleteItem(${idx})" class="text-[10px] text-rose-400 hover:text-rose-300 mt-0.5">
              <i class="fa-solid fa-trash-can"></i> Hapus
            </button>
          </div>
        </div>
      `).join('');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
        toast.classList.remove('opacity-100');
      }, 2200);
    }

    function handleAddNewItem() {
      const title = prompt('Masukkan Judul / Nama Item Baru:', 'Data #' + (appItems.length + 1));
      if (!title || !title.trim()) return;
      const subtitle = prompt('Keterangan / Kategori:', 'Umum');
      const price = prompt('Nominal / Info Nilai:', 'Rp ' + (Math.floor(Math.random() * 50) + 10) + '.000');

      appItems.unshift({
        id: Date.now().toString(),
        title: title.trim(),
        subtitle: subtitle || 'Baru',
        price: price || 'Aktif'
      });

      localStorage.setItem('app_items_KasirKu POS Pro', JSON.stringify(appItems));
      renderList(appItems);
      showToast('✅ Berhasil ditambahkan!');
    }

    function handleDeleteItem(idx) {
      if (!confirm('Hapus item ini?')) return;
      appItems.splice(idx, 1);
      localStorage.setItem('app_items_KasirKu POS Pro', JSON.stringify(appItems));
      renderList(appItems);
      showToast('🗑️ Item dihapus');
    }

    function handleQuickAction(type) {
      if (type === 'add') handleAddNewItem();
      if (type === 'filter') {
        const query = prompt('Filter berdasarkan teks:', '');
        if (query !== null) {
          const filtered = appItems.filter(i => (i.title || '').toLowerCase().includes(query.toLowerCase()));
          renderList(filtered);
        }
      }
      if (type === 'export') {
        showToast('📤 Data tersinkronisasi di memori HP');
      }
    }

    document.getElementById('searchInput')?.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = appItems.filter(i => 
        (i.title || '').toLowerCase().includes(q) || 
        (i.subtitle || '').toLowerCase().includes(q)
      );
      renderList(filtered);
    });

    document.getElementById('btnRefresh')?.addEventListener('click', () => {
      renderList(appItems);
      showToast('🔄 Tampilan diperbarui');
    });

    // Initial render
    renderList(appItems);
  </script>
</body>
</html>
